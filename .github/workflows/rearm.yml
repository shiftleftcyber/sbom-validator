name: ReARM Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  version:
    name: Determine project version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      project-version: ${{ steps.version.outputs.project-version }}
    steps:
      - name: Check out tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve project version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t release_tags < <(git tag --list 'v*' --sort=-v:refname)
          latest_tag="${release_tags[0]:-}"
          if [[ ! "${latest_tag}" =~ ^v[0-9]+[.][0-9]+[.][0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "No valid vX.Y.Z release tag was found."
            exit 1
          fi

          base_version="${latest_tag#v}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            project_version="${GITHUB_REF_NAME#v}"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            project_version="${base_version}-main-${GITHUB_RUN_NUMBER}"
          else
            project_version="${base_version}-dev-${GITHUB_RUN_NUMBER}"
          fi
          echo "project-version=${project_version}" >> "${GITHUB_OUTPUT}"

  evidence:
    needs: version
    uses: shiftleftcyber/supply-chain-workflows/.github/workflows/rearm.yml@v1
    with:
      artifact-name: rearm-signed-sbom
      component-id: ${{ vars.REARM_COMPONENT_ID }}
      deliverable-name: sbom-validator
      project-version: ${{ needs.version.outputs.project-version }}
      rearm-api-url: ${{ vars.REARM_API_URL }}
      secure-sbom-api-url: ${{ vars.SECURE_SBOM_API_URL }}
      secure-sbom-signing-key-id: ${{ vars.SECURE_SBOM_SIGNING_KEY_ID }}
      source-code-sbom-type: go
    secrets:
      rearm-api-id: ${{ secrets.REARM_COMPONENT_API_ID }}
      rearm-api-key: ${{ secrets.REARM_COMPONENT_API_KEY }}
      secure-sbom-api-key: ${{ secrets.SECURE_SBOM_API_KEY }}
