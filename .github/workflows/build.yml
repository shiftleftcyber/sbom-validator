name: Go CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions: read-all

jobs:
  build:
    uses: shiftleftcyber/supply-chain-workflows/.github/workflows/go-ci.yml@08214ced07c278eaed1c68fa459916e07f071553
    with:
      coverage-artifact-name: coverage-report
      go-version-file: go.mod
      working-directory: .
