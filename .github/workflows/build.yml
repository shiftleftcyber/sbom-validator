name: Go CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions: read-all

jobs:
  build:
    uses: shiftleftcyber/supply-chain-workflows/.github/workflows/go-ci.yml@24a5f2c9627962cf146079196bbf2a42138324a6
    with:
      coverage-artifact-name: coverage-report
      go-version-file: go.mod
      working-directory: .
