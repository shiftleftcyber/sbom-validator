name: Go Security

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "30 12 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  security:
    uses: shiftleftcyber/supply-chain-workflows/.github/workflows/security-go.yml@08214ced07c278eaed1c68fa459916e07f071553
    with:
      go-version-file: go.mod
      working-directory: .
