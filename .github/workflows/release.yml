name: Release Workflow

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  source-sbom:
    permissions:
      contents: read
    uses: shiftleftcyber/supply-chain-workflows/.github/workflows/source-sbom-go.yml@v1
    with:
      artifact-name: signed-release-sbom
      component-type: library
      file-prefix: sbom-validator-${{ github.ref_name }}
      go-version-file: go.mod
      secure-sbom-signing-key-id: ${{ vars.SECURE_SBOM_SIGNING_KEY_ID }}
      source-directory: .
    secrets:
      secure-sbom-api-key: ${{ secrets.SECURE_SBOM_API_KEY }}

  osv-scan:
    needs: source-sbom
    permissions:
      actions: read
      contents: read
    uses: shiftleftcyber/supply-chain-workflows/.github/workflows/scan-sbom-osv.yml@v1
    with:
      artifact-name: ${{ needs.source-sbom.outputs.artifact-name }}
      fail-on-vulnerabilities: false
      report-artifact-name: release-osv-scan-report
      sbom-file: ${{ needs.source-sbom.outputs.unsigned-sbom-file }}

  release:
    needs:
      - source-sbom
      - osv-scan
    permissions:
      attestations: write
      contents: write
      id-token: write
    uses: shiftleftcyber/supply-chain-workflows/.github/workflows/release-go.yml@v1
    with:
      config: .goreleaser.yaml
      evidence-artifact-name: ${{ needs.source-sbom.outputs.artifact-name }}
      evidence-file: ${{ needs.source-sbom.outputs.signed-sbom-file }}
      go-version-file: go.mod
      working-directory: .

  publish-interlynk:
    needs:
      - source-sbom
      - osv-scan
    permissions:
      actions: read
      contents: read
    uses: shiftleftcyber/supply-chain-workflows/.github/workflows/publish-sbom-interlynk.yml@v1
    with:
      artifact-name: ${{ needs.source-sbom.outputs.artifact-name }}
      environment: Production
      product: sbom-validator
      sbom-file: ${{ needs.source-sbom.outputs.signed-sbom-file }}
    secrets:
      interlynk-security-token: ${{ secrets.INTERLYNK_TOKEN }}
