name: SBOM Generation, Signing, and Vulnerability Scanning

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  source-sbom:
    uses: shiftleftcyber/supply-chain-workflows/.github/workflows/source-sbom-go.yml@v1
    with:
      artifact-name: signed-source-sbom
      fail-on-vulnerabilities: true
      file-prefix: sbom-validator-${{ github.run_id }}
      go-version-file: go.mod
      secure-sbom-signing-key-id: ${{ vars.SECURE_SBOM_SIGNING_KEY_ID }}
      source-directory: .
    secrets:
      secure-sbom-api-key: ${{ secrets.SECURE_SBOM_API_KEY }}

  publish-interlynk:
    needs: source-sbom
    uses: shiftleftcyber/supply-chain-workflows/.github/workflows/publish-sbom-interlynk.yml@v1
    with:
      artifact-name: ${{ needs.source-sbom.outputs.artifact-name }}
      environment: Development
      product: sbom-validator
      sbom-file: ${{ needs.source-sbom.outputs.signed-sbom-file }}
    secrets:
      interlynk-security-token: ${{ secrets.INTERLYNK_TOKEN }}
