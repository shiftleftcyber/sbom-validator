name: CodeQL

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: { }
  schedule:
    - cron: "42 23 * * 5"   # run friday night

permissions: { }

jobs:
  analyze:
    name: Analyze
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
    - name: Checkout Repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # tag=v4.4.0
    - name: Initialize CodeQL
      uses: github/codeql-action/init@08d09a53f0f5d694f253bd25732e4429c9e9337f # tag=v2.11.2
      with:
        languages: "go"
    - name: Run Autobuild
      uses: github/codeql-action/autobuild@08d09a53f0f5d694f253bd25732e4429c9e9337f # tag=v2.11.2
    - name: Perform Analysis
      uses: github/codeql-action/analyze@08d09a53f0f5d694f253bd25732e4429c9e9337f # tag=v2.11.2